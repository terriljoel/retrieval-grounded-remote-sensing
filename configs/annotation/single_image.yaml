app:
  title: Remote-Sensing Annotation Assistant

classes:
  - airplane
  - ship
  - storage_tank
  - baseball_diamond
  - tennis_court
  - basketball_court
  - ground_track_field
  - harbor
  - bridge
  - vehicle

detector:
  backend: ultralytics
  models:
    yolo_baseline: "${SHARED_RESOURCES_ROOT}/checkpoints/yolov8s_pretrained_1024_seed42.pt"
  default_model: yolo_baseline
  confidence: 0.25
  iou: 0.70
  image_size: 1024
  # null lets Ultralytics select CUDA in Colab and CPU locally.
  device: null

embedding:
  model_name: ViT-B-32
  repository: chendelong/RemoteCLIP
  filename: RemoteCLIP-ViT-B-32.pt
  dimension: 512
  context_margin: 0.25
  cache_dir: "${SHARED_RESOURCES_ROOT}/model_cache/huggingface"
  device: null

retrieval:
  # Set database_path for one exact artifact. When null, the newest versioned
  # artifact containing a lancedb directory is selected and shown on save.
  database_path: null
  artifact_root: "${SHARED_RESOURCES_ROOT}/embeddings"
  artifact: latest
  table: remoteclip_embeddings
  # dataset_image_path values in the persisted table are relative to this
  # raw root and already include the NWPU VHR-10 dataset directory name.
  dataset_root: "${SHARED_RESOURCES_ROOT}/datasets/raw"
  evidence_splits: [train]
  top_k: 5
  candidate_limit: 100

vlm:
  enabled: true
  # The UI can run query-only, retrieval-grounded, or both for comparison.
  default_mode: retrieval_grounded
  # Limit full evidence scenes sent to the VLM while retrieval still displays top_k.
  max_evidence: 3
  provider: nvidia_nim
  model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
  base_url: https://integrate.api.nvidia.com/v1
  api_key_variable: NIM_API_KEY
  timeout: 120
  requests_per_minute: 30
  cache_root: "${SHARED_RESOURCES_ROOT}/vlm_cache"

# A final "accept" recommendation is made only when every gate passes. The
# VLM's raw response is preserved separately for later evaluation.
decision_policy:
  detector_min_confidence: 0.80
  retrieval_min_cosine_similarity: 0.90
  retrieval_min_supporting_neighbors: 3
  vlm_min_confidence: 0.85

annotations:
  output_root: "${SHARED_RESOURCES_ROOT}/annotations/single_image"
