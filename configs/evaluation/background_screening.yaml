experiment:
  name: nwpu_missed_object_screening_seed42_v2
  output_root: "${SHARED_RESOURCES_ROOT}/experiment_outputs/background_screening"

cases:
  inference_directory: "${SHARED_RESOURCES_ROOT}/inference/nwpu_yolov8s_1024_final_predictions_nwpu_vhr10_manifest-3"
  inference_root: "${SHARED_RESOURCES_ROOT}/inference"
  manifest: "${SHARED_RESOURCES_ROOT}/datasets/manifests/nwpu_vhr10_multilabel_split_seed42.csv"
  manifest_dataset_root: "${SHARED_RESOURCES_ROOT}/datasets/raw"
  image_root: "${SHARED_RESOURCES_ROOT}/datasets/raw/NWPU VHR-10 dataset"
  splits: [test]
  # Use 5 for a smoke test; null screens all missed-object and background images.
  maximum_per_label: null
  seed: 42

classes:
  - airplane
  - ship
  - storage_tank
  - baseball_diamond
  - tennis_court
  - basketball_court
  - ground_track_field
  - harbor
  - bridge
  - vehicle

tiling:
  tile_size: 512
  overlap_fraction: 0.20
  maximum_tiles: 16

vlm:
  enabled: true
  provider: nvidia_nim
  model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
  base_url: https://integrate.api.nvidia.com/v1
  api_key_variable: NIM_API_KEY
  timeout: 120
  requests_per_minute: 30
  cache_root: "${SHARED_RESOURCES_ROOT}/vlm_cache/background_screening"
