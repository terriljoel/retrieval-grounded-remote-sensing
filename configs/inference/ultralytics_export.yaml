run:
  name: object_detection_inference

detector:
  backend: ultralytics
  checkpoint: "${SHARED_RESOURCES_ROOT}/checkpoints/best.pt"

source:
  path: "${SHARED_RESOURCES_ROOT}/datasets/raw/NWPU VHR-10 dataset"
  dataset_id: nwpu_vhr10
  # Individual image splits are taken from the deterministic manifest. The
  # fallback value is used only if an image is absent from that manifest.
  split: manifest
  manifest: "${SHARED_RESOURCES_ROOT}/datasets/manifests/nwpu_vhr10_multilabel_split_seed42.csv"
  # Manifest image paths already begin with "NWPU VHR-10 dataset/...".
  dataset_root: "${SHARED_RESOURCES_ROOT}/datasets/raw"
  # This export intentionally creates the frozen test cases used by the final
  # assistance comparison. Test images remain queries, never retrieval evidence.
  allow_test: true

# Set this section to null for prediction-only exports. When annotations are
# available, use format: yolo or format: nwpu and point path to the label folder.
ground_truth: 
  format: nwpu
  path: "${SHARED_RESOURCES_ROOT}/datasets/raw/NWPU VHR-10 dataset/ground truth"
  iou_threshold: 0.5

inference:
  imgsz: 640
  batch: 16
  confidence: 0.05
  iou: 0.70
  device: 0
  save_rendered_images: true
  save_yolo_labels: true
  save_confidence: true
  verbose: true
  exist_ok: false

outputs:
  root: "${SHARED_RESOURCES_ROOT}/inference"
