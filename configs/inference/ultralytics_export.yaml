run:
  name: object_detection_inference

detector:
  backend: ultralytics
  checkpoint: /path/to/best.pt

source:
  path: /path/to/images
  dataset_id: new_remote_sensing_dataset
  split: external
  manifest: null
  dataset_root: null
  allow_test: false

# Set this section to null for prediction-only exports. When annotations are
# available, use format: yolo or format: nwpu and point path to the label folder.
ground_truth: null

inference:
  imgsz: 640
  batch: 16
  confidence: 0.05
  iou: 0.70
  device: 0
  save_rendered_images: true
  save_yolo_labels: true
  save_confidence: true
  verbose: true
  exist_ok: false

outputs:
  root: "${EXPERIMENT_OUTPUT_ROOT}/inference"
